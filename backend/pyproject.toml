[project]
name = "it-helpdesk-backend"
version = "0.1.0"
description = "IT Helpdesk System Backend (FastAPI + SQLAlchemy 2.0 Async + LDAP + Outbox + MinIO)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "ldap3>=2.9.1",
    "minio>=7.2.10",
    "httpx>=0.27.2",
    "python-multipart>=0.0.17",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
